<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#190726"/>
      <stop offset="50%" stop-color="#2c0e3e"/>
      <stop offset="100%" stop-color="#12041a"/>
    </linearGradient>
    <radialGradient id="glow4" cx="50%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#e5c885" stop-opacity="0.32"/>
      <stop offset="45%" stop-color="#b88628" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#14051d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d4af37"/>
      <stop offset="50%" stop-color="#fff0be"/>
      <stop offset="100%" stop-color="#aa7a1e"/>
    </linearGradient>
    <linearGradient id="softgold4" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#fff0be" stop-opacity="0.25"/>
    </linearGradient>
  </defs>

  <rect width="800" height="480" fill="url(#bg4)"/>
  <circle cx="400" cy="210" r="280" fill="url(#glow4)"/>

  <!-- Grand Reception Hall & Banquet Arch Motif -->
  <g stroke="url(#gold4)" fill="none" stroke-width="1.5" opacity="0.85">
    <!-- Hall Portico Pediment -->
    <path d="M220 180 L400 90 L580 180 H220 Z"/>
    <circle cx="400" cy="140" r="14" fill="url(#softgold4)" stroke-width="1.2"/>
    <!-- Grand Hall Pillars -->
    <path d="M250 180 V440 M310 180 V440 M490 180 V440 M550 180 V440" stroke-width="1.3"/>
    <!-- Festive Floral Garland across Hall -->
    <path d="M220 220 Q400 280 580 220" stroke-width="1.6" stroke-dasharray="2 6"/>
    <path d="M280 250 Q400 310 520 250" stroke-width="1.4" opacity="0.6"/>
    <!-- Central Festive Emblem / Chalice & Toast -->
    <circle cx="400" cy="260" r="28" fill="url(#softgold4)" stroke-width="1.5"/>
    <path d="M390 250 L400 270 L410 250 M400 270 V280 M394 280 H406" stroke-width="1.2"/>
  </g>

  <!-- Sparkles -->
  <g fill="#fff3c4" opacity="0.75">
    <circle cx="180" cy="130" r="1.8"/>
    <circle cx="620" cy="130" r="2"/>
    <circle cx="150" cy="260" r="1.6"/>
    <circle cx="650" cy="260" r="1.8"/>
  </g>

  <text x="400" y="380" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-size="24" letter-spacing="4" fill="#f8e8c6">ST. THOMAS PARISH HALL</text>
  <text x="400" y="408" text-anchor="middle" font-family="'Jost', sans-serif" font-size="12" letter-spacing="3" fill="#c5a059">VALIAVELI · THIRUVANANTHAPURAM</text>
</svg>

